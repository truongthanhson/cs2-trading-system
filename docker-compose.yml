services:
  cs2ts:
    build: .
    container_name: cs2ts
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Ho_Chi_Minh
      DAILY_AT: "12:15"
    ports:
      - "${CS2TS_PORT:-8010}:8000"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
